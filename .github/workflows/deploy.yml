name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Weekly rebuild picks up new SimAware/VATSpy boundaries and the FAA NASR cycle (28-day). Mondays 07:17 UTC.
  schedule:
    - cron: '17 7 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Refresh boundary data from upstream; on any failure keep the committed copy in public/data.
      - name: Refresh TRACON/FIR boundaries
        run: npm run data:boundaries || echo "::warning::Boundary refresh failed — deploying committed public/data"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Refresh US towered airports (D/G/T/A + tower hours) from the current FAA NASR 28-day cycle.
      - name: Refresh FAA airport data
        run: npm run data:airports || echo "::warning::FAA NASR refresh failed — deploying committed public/data/airports-us.json"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # SPA fallback: Pages serves 404.html for unknown paths.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
