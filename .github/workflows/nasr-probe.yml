name: NASR probe (temporary)
on:
  push:
    branches: [scratch/nasr-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          c=29_Oct_2026
          for z in ATC FRQ APT; do curl -fsSL -o $z.zip "https://nfdc.faa.gov/webContent/28DaySub/extra/${c}_${z}_CSV.zip"; mkdir $z; unzip -o -q $z.zip -d $z; done
          echo "=== ATC structure"; cat ATC/ATC_CSV_DATA_STRUCTURE.csv
          echo "=== FRQ structure"; cat FRQ/FRQ_CSV_DATA_STRUCTURE.csv
          for f in ATC/ATC_BASE.csv ATC/ATC_SVC.csv FRQ/FRQ.csv; do echo "=== $f ($(wc -l < $f) lines)"; head -1 $f; grep -E ',"?(SLC|CLT|TYS|PVU|AGS|A80|ATL)"?,' $f | head -14; done
          echo "=== APT_BASE"; head -1 APT/APT_BASE.csv; grep -E ',"?(SLC|PVU|TYS)"?,' APT/APT_BASE.csv | head -3
      - run: |
          python3 <<'PY'
          import csv,collections
          for f in ['ATC/ATC_BASE.csv','ATC/ATC_SVC.csv','FRQ/FRQ.csv']:
            r=csv.DictReader(open(f,encoding='latin-1')); cols=r.fieldnames; rows=list(r)
            print('###',f,len(rows),cols)
            for k in cols:
              vals=collections.Counter(x[k] for x in rows)
              if len(vals)<=60: print('  ',k,vals.most_common(60))
          PY
