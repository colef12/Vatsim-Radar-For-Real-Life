name: NASR probe (temporary)
on:
  push:
    branches: [scratch/nasr-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p nasr-sample
          for z in APT; do curl -fsSL -o nasr-sample/29_Oct_2026_${z}_CSV.zip "https://nfdc.faa.gov/webContent/28DaySub/extra/29_Oct_2026_${z}_CSV.zip"; done
          ls -la nasr-sample
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nasr-sample && git commit -m "temp: NASR APT zip [skip ci]" && git push
