name: Deploy traffic relay (Cloudflare Worker)

# Deploys proxy/ to Cloudflare Workers. Needs two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token with the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  from the Cloudflare dashboard (Workers & Pages → right sidebar)
# Without them the job is skipped, nothing fails.

on:
  push:
    branches: [main]
    paths: ['proxy/**', '.github/workflows/proxy.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proxy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set — skipping Worker deploy"; fi
      - if: steps.secrets.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.secrets.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Deploy
        if: steps.secrets.outputs.ok == 'true'
        working-directory: proxy
        run: npx --yes wrangler@4 deploy 2>&1 | tee deploy.log
      - name: Smoke test
        if: steps.secrets.outputs.ok == 'true'
        working-directory: proxy
        run: |
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "Worker URL: $URL"
          curl -fsS -H "Origin: https://colef12.github.io" "$URL/health"
          echo
          curl -sS -o /dev/null -w "point: %{http_code}\n" -H "Origin: https://colef12.github.io" "$URL/v2/point/35.8/-84/50"
          curl -sS -o /dev/null -w "no-origin (expect 403): %{http_code}\n" "$URL/health"
